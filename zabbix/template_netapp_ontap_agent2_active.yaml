          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},volumes]'
          lld_macro_paths:
            - lld_macro: '{#SVMNAME}'
              path: $.svm.name
            - lld_macro: '{#VOLNAME}'
              path: $.name
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.records
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
      tags:
        - tag: class
          value: storage
        - tag: target
          value: netapp
      macros:
        - macro: '{$NETAPP.AGGR.PUSED.HIGH}'
          value: '90'
          description: 'Aggregate used %% high.'
        - macro: '{$NETAPP.AGGR.PUSED.WARN}'
          value: '80'
          description: 'Aggregate used %% warning. Context macro per aggregate supported.'
        - macro: '{$NETAPP.CACHE.DIR}'
          value: /var/cache/ontap
          description: 'Cache directory used by ontap-poller.py and the UserParameter.'
        - macro: '{$NETAPP.CLUSTER.ID}'
          value: onprem
          description: 'Cluster id — must match a [cluster:<id>] section in /etc/ontap-poller.conf (e.g. onprem, fsx).'
        - macro: '{$NETAPP.CLUSTER.LAT.HIGH}'
          value: '20'
          description: 'Cluster avg latency high, ms.'
        - macro: '{$NETAPP.CLUSTER.LAT.WARN}'
          value: '5'
          description: 'Cluster avg latency warning, ms.'
        - macro: '{$NETAPP.DATA.MAXAGE}'
          value: 15m
          description: 'Max allowed age of cache files before the staleness trigger fires.'
        - macro: '{$NETAPP.SM.LAG.HIGH}'
          value: '21600'
          description: 'SnapMirror lag high, seconds (6h).'
        - macro: '{$NETAPP.SM.LAG.HIGH:"daily"}'
          value: '129600'
          description: 'SnapMirror lag high, seconds (36h).'
        - macro: '{$NETAPP.SM.LAG.HIGH:"daily-esxi"}'
          value: '129600'
          description: 'SnapMirror lag high, seconds (36h).'
        - macro: '{$NETAPP.SM.LAG.HIGH:"daily-obv"}'
          value: '129600'
          description: 'SnapMirror lag high, seconds (36h).'
        - macro: '{$NETAPP.SM.LAG.HIGH:"pg-2hourly"}'
          value: '28800'
          description: 'SnapMirror lag high, seconds (8h).'
        - macro: '{$NETAPP.SM.LAG.WARN}'
          value: '10800'
          description: 'SnapMirror lag warning, seconds (3h).'
        - macro: '{$NETAPP.SM.LAG.WARN:"daily"}'
          value: '108000'
          description: 'SnapMirror lag high, seconds (30h).'
        - macro: '{$NETAPP.SM.LAG.WARN:"daily-esxi"}'
          value: '108000'
          description: 'SnapMirror lag high, seconds (30h).'
        - macro: '{$NETAPP.SM.LAG.WARN:"daily-obv"}'
          value: '108000'
          description: 'SnapMirror lag high, seconds (30h).'
        - macro: '{$NETAPP.SM.LAG.WARN:"pg-2hourly"}'
          value: '18000'
          description: 'SnapMirror lag high, seconds (5h).'
        - macro: '{$NETAPP.SM.UNHEALTHY.DELAY}'
          value: 30m
          description: 'How long a SnapMirror relationship must be unhealthy before alerting (filters baseline noise).'
        - macro: '{$NETAPP.VOL.LAT.WARN}'
          value: '10'
          description: 'Volume total latency warning, ms (5m avg).'
        - macro: '{$NETAPP.VOL.NAME.MATCHES}'
          value: '.*'
          description: 'Volume discovery include filter.'
        - macro: '{$NETAPP.VOL.NAME.NOT_MATCHES}'
          value: '^(vol0|.*_root)$'
          description: 'Volume discovery exclude filter (node/SVM root volumes by default).'
        - macro: '{$NETAPP.VOL.PUSED.HIGH}'
          value: '95'
          description: 'Volume used %% high.'
        - macro: '{$NETAPP.VOL.PUSED.WARN}'
          value: '85'
          description: 'Volume used %% warning. Context macro per volume supported.'
        - macro: '{$NETAPP.VOL.TIMELEFT.HIGH}'
          value: 2d
          description: 'Projected time to 100%% used, high. Regression over 7d of history.'
        - macro: '{$NETAPP.VOL.TIMELEFT.MINPUSED}'
          value: '50'
          description: 'Minimum used %% before the time-to-full projection is allowed to alert. Suppresses wild regressions on nearly empty volumes and during the first days after import.'
        - macro: '{$NETAPP.VOL.TIMELEFT.WARN}'
          value: 7d
          description: 'Projected time to 100%% used, warning. Regression over 7d of history.'
