zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 3d41acceba6843019824e61043459bcc
      name: Templates/Storage
  templates:
    - uuid: ad9c46535b9a46069a5f3eedec9a9588
      template: 'NetApp ONTAP AFF-A20 - Zabbix Agent2'
      name: 'NetApp ONTAP AFF-A20 - Zabbix Agent2'
      description: |
        NetApp ONTAP monitoring for Zabbix 8 using ONLY Zabbix Agent 2 active checks.
        Data flow: ontap-poller.py (systemd timer) -> ONTAP REST API -> JSON cache files -> UserParameter netapp.raw[*] -> master items -> LLD + dependent items.
        Covers: cluster info & performance (IOPS/latency/throughput), nodes (state, HW health), aggregates (state, capacity, perf), volumes (state, capacity, perf), SVMs, disk summary, SnapMirror relationships (healthy, state, lag).
        Apply once per monitored cluster: set {$NETAPP.CLUSTER.ID} per host (onprem / fsx) and make sure the agent Hostname list contains each Zabbix host name.
        Tested against ONTAP 9.13+ REST API (AFF A-series, incl. AFF-A20) and FSx for ONTAP.
      groups:
        - name: Templates/Storage
      items:
        - uuid: 97a9f94d8c2045aba96cfa62fc278f48
          name: 'Cluster: IOPS other'
          type: DEPENDENT
          key: 'netapp.cluster.iops[other]'
          history: 7d
          value_type: FLOAT
          units: ops
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.iops.other
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 0f620ad273db4e1080e44d12a36fcaa3
          name: 'Cluster: IOPS read'
          type: DEPENDENT
          key: 'netapp.cluster.iops[read]'
          history: 7d
          value_type: FLOAT
          units: ops
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.iops.read
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 6b5ed32e01d548009adda9e0f3999041
          name: 'Cluster: IOPS total'
          type: DEPENDENT
          key: 'netapp.cluster.iops[total]'
          history: 7d
          value_type: FLOAT
          units: ops
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.iops.total
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 2c4a4facd4c04c0085d37da653f3aabc
          name: 'Cluster: IOPS write'
          type: DEPENDENT
          key: 'netapp.cluster.iops[write]'
          history: 7d
          value_type: FLOAT
          units: ops
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.iops.write
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 2602ffbeedd346a895316f24e608504f
          name: 'Cluster: latency other'
          type: DEPENDENT
          key: 'netapp.cluster.latency[other]'
          history: 7d
          value_type: FLOAT
          units: ms
          description: 'ONTAP reports microseconds; converted to ms.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.latency.other
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 81ada535b2ec46f89b30ec3f92c14955
          name: 'Cluster: latency read'
          type: DEPENDENT
          key: 'netapp.cluster.latency[read]'
          history: 7d
          value_type: FLOAT
          units: ms
          description: 'ONTAP reports microseconds; converted to ms.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.latency.read
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: b9c5d3b6e172435c82062f3802c172da
          name: 'Cluster: latency total'
          type: DEPENDENT
          key: 'netapp.cluster.latency[total]'
          history: 7d
          value_type: FLOAT
          units: ms
          description: 'ONTAP reports microseconds; converted to ms.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.latency.total
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
          triggers:
            - uuid: f550a66942cb44adae1a9302eac54b20
              expression: 'avg(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.cluster.latency[total],5m)>{$NETAPP.CLUSTER.LAT.HIGH}'
              name: 'NetApp [{$NETAPP.CLUSTER.ID}]: cluster average latency > {$NETAPP.CLUSTER.LAT.HIGH} ms (5m avg)'
              priority: HIGH
            - uuid: a05e0a04a7c245029380fa89d1891d64
              expression: 'avg(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.cluster.latency[total],5m)>{$NETAPP.CLUSTER.LAT.WARN}'
              name: 'NetApp [{$NETAPP.CLUSTER.ID}]: cluster average latency > {$NETAPP.CLUSTER.LAT.WARN} ms (5m avg)'
              priority: WARNING
        - uuid: db74b7eb10674619b66e25331d7c395b
          name: 'Cluster: latency write'
          type: DEPENDENT
          key: 'netapp.cluster.latency[write]'
          history: 7d
          value_type: FLOAT
          units: ms
          description: 'ONTAP reports microseconds; converted to ms.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.latency.write
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 64073872b1c84951a89e0ea2a607bc48
          name: 'Cluster: perf metric status'
          type: DEPENDENT
          key: netapp.cluster.metric.status
          history: 7d
          value_type: CHAR
          description: '"ok" means performance data is fresh on the cluster side.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.status
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 7697e313db67421c91525d78e529e2c8
          name: 'Cluster: name'
          type: DEPENDENT
          key: netapp.cluster.name
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.name
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 640107e0181e45829f161d0605d0f806
          name: 'Cluster: throughput other'
          type: DEPENDENT
          key: 'netapp.cluster.throughput[other]'
          history: 7d
          value_type: FLOAT
          units: Bps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.throughput.other
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 577bd7e528bf40efa6ca6bd6275c5616
          name: 'Cluster: throughput read'
          type: DEPENDENT
          key: 'netapp.cluster.throughput[read]'
          history: 7d
          value_type: FLOAT
          units: Bps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.throughput.read
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 58238e83f5bc47f4a952d10f0515b25d
          name: 'Cluster: throughput total'
          type: DEPENDENT
          key: 'netapp.cluster.throughput[total]'
          history: 7d
          value_type: FLOAT
          units: Bps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.throughput.total
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: bd6a2cb0da9147259793529405f0f726
          name: 'Cluster: throughput write'
          type: DEPENDENT
          key: 'netapp.cluster.throughput[write]'
          history: 7d
          value_type: FLOAT
          units: Bps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metric.throughput.write
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
        - uuid: 7a66d3133bc641e499ad29270b6cfcde
          name: 'Cluster: ONTAP version'
          type: DEPENDENT
          key: netapp.cluster.version
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.version.full
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          tags:
            - tag: component
              value: cluster
          triggers:
            - uuid: b0cd4927d58a443a9d56d5e2fd0dafa0
              expression: 'last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.cluster.version,#1)<>last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.cluster.version,#2) and length(last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.cluster.version))>0'
              name: 'NetApp [{$NETAPP.CLUSTER.ID}]: ONTAP version has changed (new: {ITEM.LASTVALUE})'
              priority: INFO
              manual_close: 'YES'
        - uuid: 32004d34fd7b4b7985a3a9e99f73141e
          name: 'Disks: broken count'
          type: DEPENDENT
          key: netapp.disk.broken
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.records[?(@.state==''broken'')].length()'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},disks]'
          tags:
            - tag: component
              value: disk
          triggers:
            - uuid: ef0f6b34100d4f5f8bc84c67e73d002e
              expression: 'last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.disk.broken)>0'
              name: 'NetApp [{$NETAPP.CLUSTER.ID}]: {ITEM.LASTVALUE} broken disk(s) detected'
              priority: HIGH
        - uuid: 0e9004f55aad436386534467665cb473
          name: 'Disks: spare count'
          type: DEPENDENT
          key: netapp.disk.spare
          history: 7d
          description: 'On FSx the disk endpoint is not exposed; stays 0.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.records[?(@.container_type==''spare'')].length()'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},disks]'
          tags:
            - tag: component
              value: disk
        - uuid: c62dbabde5ec4102972a9e8f6e12209e
          name: 'Disks: total count'
          type: DEPENDENT
          key: netapp.disk.total
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.records.length()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},disks]'
          tags:
            - tag: component
              value: disk
        - uuid: e99c8d8f5d0b4eff9bca69702cf3f6a8
          name: 'Cluster peers: unavailable count'
          type: DEPENDENT
          key: netapp.peer.unavailable
          history: 7d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'try { var d = JSON.parse(value); return d.records.filter(function (r) { return !r.status || r.status.state !== ''available''; }).length; } catch (e) { return 0; }'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},peers]'
          tags:
            - tag: component
              value: disk
          triggers:
            - uuid: d39a0839da784f4cac5909be92ba10e6
              expression: 'last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.peer.unavailable)>0'
              name: 'NetApp [{$NETAPP.CLUSTER.ID}]: cluster peer unavailable'
              priority: DISASTER
        - uuid: 03c7f4acd0fe424db06a5c3c32c83a18
          name: 'Raw: aggregates'
          type: ZABBIX_ACTIVE
          key: 'netapp.raw[{$NETAPP.CLUSTER.ID},aggregates]'
          history: '0'
          value_type: TEXT
          description: 'Raw JSON from cached ONTAP REST endpoint (aggregates). Populated by ontap-poller.py.'
          tags:
            - tag: component
              value: raw
        - uuid: 1101c37882c64a5a87736533468e0ba6
          name: 'Raw: cluster'
          type: ZABBIX_ACTIVE
          key: 'netapp.raw[{$NETAPP.CLUSTER.ID},cluster]'
          history: '0'
          value_type: TEXT
          description: 'Raw JSON from cached ONTAP REST endpoint (cluster). Populated by ontap-poller.py.'
          tags:
            - tag: component
              value: raw
        - uuid: 6e34c720eef74ed5ac7881a114515267
          name: 'Raw: disks'
          type: ZABBIX_ACTIVE
          key: 'netapp.raw[{$NETAPP.CLUSTER.ID},disks]'
          history: '0'
          value_type: TEXT
          description: 'Raw JSON from cached ONTAP REST endpoint (disks). Populated by ontap-poller.py.'
          tags:
            - tag: component
              value: raw
        - uuid: afa0c8ad667b4af89875163d1b894870
          name: 'Raw: nodes'
          type: ZABBIX_ACTIVE
          key: 'netapp.raw[{$NETAPP.CLUSTER.ID},nodes]'
          history: '0'
          value_type: TEXT
          description: 'Raw JSON from cached ONTAP REST endpoint (nodes). Populated by ontap-poller.py.'
          tags:
            - tag: component
              value: raw
        - uuid: ef0bcb4a597e482b8c4dd5c3f954858f
          name: 'Raw: cluster peers'
          type: ZABBIX_ACTIVE
          key: 'netapp.raw[{$NETAPP.CLUSTER.ID},peers]'
          history: '0'
          value_type: TEXT
          description: 'Raw JSON from cached ONTAP REST endpoint (svms). Populated by ontap-poller.py.'
          tags:
            - tag: component
              value: raw
        - uuid: f9c03717097144bb99b585f4daf1592a
          name: 'Raw: SnapMirror'
          type: ZABBIX_ACTIVE
          key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
          history: '0'
          value_type: TEXT
          description: 'Raw JSON from cached ONTAP REST endpoint (snapmirror). Populated by ontap-poller.py.'
          tags:
            - tag: component
              value: raw
        - uuid: cdfdce1291eb4b4c83c1bdf050e65a3f
          name: 'Raw: SVMs'
          type: ZABBIX_ACTIVE
          key: 'netapp.raw[{$NETAPP.CLUSTER.ID},svms]'
          history: '0'
          value_type: TEXT
          description: 'Raw JSON from cached ONTAP REST endpoint (svms). Populated by ontap-poller.py.'
          tags:
            - tag: component
              value: raw
        - uuid: 88e33c1f7be04247a854e9ffc1b61bd1
          name: 'Raw: volumes'
          type: ZABBIX_ACTIVE
          key: 'netapp.raw[{$NETAPP.CLUSTER.ID},volumes]'
          history: '0'
          value_type: TEXT
          description: 'Raw JSON from cached ONTAP REST endpoint (volumes). Populated by ontap-poller.py.'
          tags:
            - tag: component
              value: raw
        - uuid: 5396d995a1054ba7af54fa4b0f1ad82e
          name: 'SnapMirror: relationship count'
          type: DEPENDENT
          key: netapp.sm.count
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.records.length()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
          tags:
            - tag: component
              value: disk
        - uuid: 8cbdd35aa4294f7193c55a6266a365b1
          name: 'SnapMirror: unhealthy count'
          type: DEPENDENT
          key: netapp.sm.unhealthy_count
          history: 7d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'try { var d = JSON.parse(value); return d.records.filter(function (r) { return r.healthy === false; }).length; } catch (e) { return 0; }'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
          tags:
            - tag: component
              value: disk
        - uuid: 75dc51623e0f4b52a967f4f6bab2f866
          name: 'Volumes: total count'
          type: DEPENDENT
          key: netapp.vol.count
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.records.length()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},volumes]'
          tags:
            - tag: component
              value: disk
        - uuid: cd950404d5ec4f48b0891b358520f2f5
          name: 'Poller: cache data age'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.time["{$NETAPP.CACHE.DIR}/{$NETAPP.CLUSTER.ID}_cluster.json",modify]'
          history: 7d
          units: unixtime
          description: 'Modification time of the cluster cache file. Detects a dead/stuck poller.'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: e6d4a866aa6746088222d4a16ed699c4
              expression: 'fuzzytime(/NetApp ONTAP AFF-A20 - Zabbix Agent2/vfs.file.time["{$NETAPP.CACHE.DIR}/{$NETAPP.CLUSTER.ID}_cluster.json",modify],{$NETAPP.DATA.MAXAGE})=0'
              name: 'NetApp [{$NETAPP.CLUSTER.ID}]: cache data is stale (poller not running)'
              priority: WARNING
              description: 'ontap-poller.py has not refreshed cache files. Check systemd timer ontap-poller.timer and API connectivity.'
      discovery_rules:
        - uuid: cfc4aac39c70429c88ffa2ee94aee2f6
          name: 'Aggregate discovery'
          type: DEPENDENT
          key: netapp.aggr.discovery
          item_prototypes:
            - uuid: c29d6ee1d503403e8035ae73972beee1
              name: 'Aggregate {#AGGRNAME}: IOPS total'
              type: DEPENDENT
              key: 'netapp.aggr.iops[{#AGGRNAME},total]'
              history: 7d
              value_type: FLOAT
              units: ops
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.name==''{#AGGRNAME}'')].metric.iops.total.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},aggregates]'
              tags:
                - tag: component
                  value: aggregate
            - uuid: 422fac996a044131a4c76ef9ddef8351
              name: 'Aggregate {#AGGRNAME}: latency total'
              type: DEPENDENT
              key: 'netapp.aggr.latency[{#AGGRNAME},total]'
              history: 7d
              value_type: FLOAT
              units: ms
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.name==''{#AGGRNAME}'')].metric.latency.total.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},aggregates]'
              tags:
                - tag: component
                  value: aggregate
            - uuid: 6a1e15ae3cc74d1c9c644e74a1858d86
              name: 'Aggregate {#AGGRNAME}: available'
              type: DEPENDENT
              key: 'netapp.aggr.space.avail[{#AGGRNAME}]'
              history: 7d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.name==''{#AGGRNAME}'')].space.block_storage.available.first()'
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},aggregates]'
              tags:
                - tag: component
                  value: aggregate
            - uuid: a617fdde439c4b16b14155d5c840ae18
              name: 'Aggregate {#AGGRNAME}: used, %'
              type: DEPENDENT
              key: 'netapp.aggr.space.pused[{#AGGRNAME}]'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'Computed in preprocessing from block_storage.used/size of the same record.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.name==''{#AGGRNAME}'')].first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '{}'
                - type: JAVASCRIPT
                  parameters:
                    - 'try { var o = JSON.parse(value); var b = o.space.block_storage; if (!b || !b.size || b.size == 0) return 0; return (100 * b.used / b.size).toFixed(4); } catch (e) { return 0; }'
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},aggregates]'
              tags:
                - tag: component
                  value: aggregate
              trigger_prototypes:
                - uuid: 20f2359857dd4323b383dbb7920cce9e
                  expression: 'last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.aggr.space.pused[{#AGGRNAME}])>{$NETAPP.AGGR.PUSED.HIGH:"{#AGGRNAME}"}'
                  name: 'Aggregate {#AGGRNAME}: used > {$NETAPP.AGGR.PUSED.HIGH:"{#AGGRNAME}"}%'
                  priority: HIGH
                - uuid: 25da640af8ba4f4da7dbbf5ceae5125c
                  expression: 'last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.aggr.space.pused[{#AGGRNAME}])>{$NETAPP.AGGR.PUSED.WARN:"{#AGGRNAME}"}'
                  name: 'Aggregate {#AGGRNAME}: used > {$NETAPP.AGGR.PUSED.WARN:"{#AGGRNAME}"}%'
                  priority: WARNING
            - uuid: bca204aa414b496982b18dd4cff1900a
              name: 'Aggregate {#AGGRNAME}: size'
              type: DEPENDENT
              key: 'netapp.aggr.space.size[{#AGGRNAME}]'
              history: 7d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.name==''{#AGGRNAME}'')].space.block_storage.size.first()'
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},aggregates]'
              tags:
                - tag: component
                  value: aggregate
            - uuid: 7f952e85369a4457828314a0b6ee45de
              name: 'Aggregate {#AGGRNAME}: used'
              type: DEPENDENT
              key: 'netapp.aggr.space.used[{#AGGRNAME}]'
              history: 7d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.name==''{#AGGRNAME}'')].space.block_storage.used.first()'
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},aggregates]'
              tags:
                - tag: component
                  value: aggregate
            - uuid: ec39fd3a2b724922acb181d5fa21a30f
              name: 'Aggregate {#AGGRNAME}: state'
              type: DEPENDENT
