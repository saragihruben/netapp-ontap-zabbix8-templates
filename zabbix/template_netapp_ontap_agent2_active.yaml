        - uuid: dfa6495277734d12b880c6a5780e7fa0
          name: 'SnapMirror relationship discovery'
          type: DEPENDENT
          key: netapp.sm.discovery
          item_prototypes:
            - uuid: 40cd5f8b9a844b36915c86a30100afd0
              name: 'SnapMirror {#DEST}: healthy'
              type: DEPENDENT
              key: 'netapp.sm.healthy[{#DEST}]'
              history: 7d
              description: '1 = healthy, 0 = unhealthy. Source: {#SRC}'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.destination.path==''{#DEST}'')].healthy.first()'
                - type: BOOL_TO_DECIMAL
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
              tags:
                - tag: component
                  value: snapmirror
            - uuid: 4aa92e98d8f0417990f6328cb8ac32e6
              name: 'SnapMirror {#DEST}: lag time'
              type: DEPENDENT
              key: 'netapp.sm.lag[{#DEST}]'
              history: 7d
              units: s
              description: 'ISO8601 duration converted to seconds.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.destination.path==''{#DEST}'')].lag_time.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: PT0S
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var m = value.match(/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$/);
                      if (!m) return 0;
                      return (parseInt(m[1]||0)*86400 + parseInt(m[2]||0)*3600 + parseInt(m[3]||0)*60 + Math.round(parseFloat(m[4]||0)));
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
              tags:
                - tag: component
                  value: snapmirror
              trigger_prototypes:
                - uuid: dbef8c904d8b41c3a2f19afdbce4f0bf
                  expression: 'last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.sm.lag[{#DEST}])>{$NETAPP.SM.LAG.HIGH:"{#SCHEDULE}"}'
                  name: 'SnapMirror {#DEST}: lag > {$NETAPP.SM.LAG.HIGH:"{#DEST}"}s'
                  priority: HIGH
                - uuid: dc9dcff634364efab9da61dcf0a255af
                  expression: 'last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.sm.lag[{#DEST}])>{$NETAPP.SM.LAG.WARN:"{#SCHEDULE}"}'
                  name: 'SnapMirror {#DEST}: lag > {$NETAPP.SM.LAG.WARN:"{#DEST}"}s'
                  priority: WARNING
            - uuid: 559ffa5b54c5404fb71346f88a0ed44b
              name: 'SnapMirror {#DEST}: last transfer end'
              type: DEPENDENT
              key: 'netapp.sm.last_end[{#DEST}]'
              history: 7d
              units: unixtime
              description: 'ISO8601 duration converted to seconds.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.destination.path==''{#DEST}'')].transfer.end_time.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!value || value == '0') return 0;
                      return Math.floor(Date.parse(value) / 1000);
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
              tags:
                - tag: component
                  value: snapmirror
            - uuid: 3d7d6e477dec4f748b87e19a8a64bc83
              name: 'SnapMirror {#DEST}: last transfer size'
              type: DEPENDENT
              key: 'netapp.sm.last_size[{#DEST}]'
              history: 7d
              units: B
              description: 'ISO8601 duration converted to seconds.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.destination.path==''{#DEST}'')].transfer.bytes_transferred.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
              tags:
                - tag: component
                  value: snapmirror
            - uuid: e8027199de414c839f7c5a35e4e5c5c1
              name: 'SnapMirror {#DEST}: unhealthy reason'
              type: DEPENDENT
              key: 'netapp.sm.reason[{#DEST}]'
              history: 7d
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.destination.path==''{#DEST}'')].unhealthy_reason.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try { var a = JSON.parse(value); return a.map(function (x) { return x.message; }).join('; '); }
                      catch (e) { return ''; }
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
              tags:
                - tag: component
                  value: snapmirror
            - uuid: 273e5719e61e4fee91097fc1ab447059
              name: 'SnapMirror {#DEST}: state'
              type: DEPENDENT
              key: 'netapp.sm.state[{#DEST}]'
              history: 7d
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.destination.path==''{#DEST}'')].state.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
              tags:
                - tag: component
                  value: snapmirror
              trigger_prototypes:
                - uuid: fbdabfb05a594e8980d5b67f1428a999
                  expression: 'last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.sm.state[{#DEST}])="broken_off"'
                  name: 'SnapMirror {#DEST}: relationship is broken_off'
                  priority: AVERAGE
            - uuid: c67104b698bb4aef8530b269daa1f06c
              name: 'SnapMirror {#DEST}: transfer state'
              type: DEPENDENT
              key: 'netapp.sm.xfer_state[{#DEST}]'
              history: 7d
              value_type: CHAR
              description: 'idle when no transfer object is present.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.destination.path==''{#DEST}'')].transfer.state.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: idle
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
              tags:
                - tag: component
                  value: snapmirror
          trigger_prototypes:
            - uuid: 30fd0ffd00b74b4c8f09529145c144a7
              expression: 'max(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.sm.healthy[{#DEST}],{$NETAPP.SM.UNHEALTHY.DELAY})=0 and length(last(/NetApp ONTAP AFF-A20 - Zabbix Agent2/netapp.sm.reason[{#DEST}]))>=0'
              name: 'SnapMirror {#DEST}: unhealthy for {$NETAPP.SM.UNHEALTHY.DELAY} (reason: {ITEM.LASTVALUE2})'
              priority: HIGH
              description: 'Sustained unhealthy state. During baseline initialization this is expected — the delay filters the initial noise.'
          graph_prototypes:
            - uuid: 5268ab1ca63d4b0ebfec25eeac0e38f6
              name: 'SnapMirror {#DEST}: lag time'
              graph_items:
                - color: E67E22
                  item:
                    host: 'NetApp ONTAP AFF-A20 - Zabbix Agent2'
                    key: 'netapp.sm.lag[{#DEST}]'
          master_item:
            key: 'netapp.raw[{$NETAPP.CLUSTER.ID},snapmirror]'
          lld_macro_paths:
            - lld_macro: '{#DEST}'
              path: $.destination.path
            - lld_macro: '{#SCHEDULE}'
              path: $.transfer_schedule.name
            - lld_macro: '{#SRC}'
              path: $.source.path
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.records
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
