            - uuid: 7e23140966dc484a9cd0fb8d251037be
              name: 'Volume [{#SVMNAME}/{#VOLNAME}]: space snapshot within reserve'
              type: DEPENDENT
              key: 'netapp.vol.space.snapinreserve[{#SVMNAME},{#VOLNAME}]'
              history: 31d
              trends: '365d'
              value_type: FLOAT
              units: B
              description: |
                Snapshot blocks held inside the configured snapshot reserve - the part that does NOT
                steal space from the active filesystem. Computed as snapshot.used - snapshot_spill.
                On Trident-provisioned volumes snapshotReserve is 0, so this band sits flat at zero
                and all snapshot consumption appears in the spill band instead.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.records[?(@.name==''{#VOLNAME}'' && @.svm.name==''{#SVMNAME}'')].space.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '{}'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = JSON.parse(value);
                      if (!s || !s.snapshot) { return 0; }
                      return Math.max(0, (s.snapshot.used || 0) - (s.snapshot_spill || 0));
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'netapp.raw[{$NETAPP.CLUSTER.ID},volumes]'
              tags:
                - tag: component
                  value: volume
                - tag: component
                  value: capacity
            - uuid: 18803ba82f264e1d9a39b4f1bb51f361
