# /etc/zabbix/zabbix_agent2.d/netapp.conf
#
# The agent performs NO API calls. It only returns the JSON that
# ontap-poller.py has already fetched into /var/cache/ontap/.
#
#   key:  netapp.raw[<cluster_id>,<endpoint>]
#   file: /var/cache/ontap/<cluster_id>_<endpoint>.json
#
# endpoints: cluster nodes aggregates volumes svms peers disks snapmirror
UserParameter=netapp.raw[*],cat /var/cache/ontap/$1_$2.json
